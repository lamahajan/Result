<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marks Entry</title>
<style>
:root {
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink-soft:#6e6e73; --ink-faint:#a1a1a6;
  --line:rgba(0,0,0,.08); --accent:#0071e3; --accent-press:#0060c7; --warn:#d92d20; --good:#1a7f37;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px -12px rgba(0,0,0,.12);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink-soft:#98989d; --ink-faint:#636366;
    --line:rgba(255,255,255,.09); --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink-soft:#98989d; --ink-faint:#636366;
  --line:rgba(255,255,255,.09); --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; background:var(--bg); color:var(--ink); min-height:100%;
  font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
header {
  position:sticky; top:0; z-index:10; padding:calc(14px + env(safe-area-inset-top,0px)) 22px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid var(--line);
}
header h1 { font-size:1.05rem; font-weight:600; margin:0; letter-spacing:-.01em; }
header .who { font-size:.82rem; color:var(--ink-soft); }
main { max-width:640px; margin:0 auto; padding:28px 18px 80px; }
.center-stage { min-height:calc(100vh - 140px); display:flex; align-items:center; justify-content:center; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:26px; margin-bottom:16px; box-shadow:var(--shadow);
}
.card.tight { padding:20px; }
h2.card-title { font-size:1.3rem; font-weight:700; letter-spacing:-.02em; margin:0 0 4px; }
p.card-sub { color:var(--ink-soft); font-size:.9rem; margin:0 0 20px; }
label { display:block; font-size:.78rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
input, select {
  font:inherit; font-size:1rem; padding:12px 14px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 55%, var(--card) 45%); color:var(--ink); width:100%;
  transition:border-color .15s ease, box-shadow .15s ease; -webkit-appearance:none; appearance:none;
}
input::placeholder { color:var(--ink-faint); }
input:focus, select:focus {
  outline:none; border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
}
select {
  background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%236e6e73'%3e%3cpath fill-rule='evenodd' d='M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z' clip-rule='evenodd'/%3e%3c/svg%3e");
  background-repeat:no-repeat; background-position:right 12px center; padding-right:34px;
}
.field { margin-bottom:14px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
button {
  font:inherit; font-weight:600; font-size:.95rem; cursor:pointer; border:none;
  border-radius:980px; padding:13px 22px; transition:transform .12s ease, opacity .12s ease, background .12s ease;
}
button.primary { background:var(--accent); color:#fff; width:100%; }
button.primary:hover { background:var(--accent-press); }
button.primary:active { transform:scale(.98); }
button.primary:disabled { opacity:.4; cursor:default; transform:none; }
button.ghost { background:color-mix(in srgb, var(--ink) 6%, transparent); color:var(--ink); }
button.ghost:hover { background:color-mix(in srgb, var(--ink) 10%, transparent); }
button.ghost:active { transform:scale(.98); }
.linklike {
  background:none; border:none; color:var(--accent); font-size:.85rem; font-weight:500;
  padding:4px 0; cursor:pointer; text-decoration:none; display:inline-block;
}
.segmented {
  display:flex; gap:3px; padding:3px; background:color-mix(in srgb, var(--ink) 6%, transparent);
  border-radius:var(--r-sm); margin-bottom:14px;
}
.segmented button {
  flex:1; background:transparent; color:var(--ink-soft); padding:9px 8px; border-radius:8px;
  font-size:.86rem; font-weight:600; white-space:nowrap;
}
.segmented button.active { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
table { width:100%; border-collapse:collapse; font-size:.94rem; }
th { text-align:left; padding:0 6px 10px; color:var(--ink-faint); font-weight:600; font-size:.72rem; letter-spacing:.02em; }
td { padding:11px 6px; border-top:1px solid var(--line); vertical-align:middle; }
td.roll { color:var(--ink-soft); width:44px; }
td.marks { text-align:right; width:110px; }
td.marks input {
  width:84px; padding:8px 10px; text-align:right; font-variant-numeric:tabular-nums;
}
td.marks .locked {
  display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  justify-content:flex-end; width:100%;
}
td.marks .locked svg { width:14px; height:14px; opacity:.55; }
.tablewrap { overflow-x:auto; margin:0 -6px; }
.status { font-size:.85rem; margin-top:10px; min-height:1.2em; color:var(--ink-soft); }
.status.ok { color:var(--good); }
.status.err { color:var(--warn); }
.hidden { display:none !important; }
.toprow { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
.small { font-size:.78rem; color:var(--ink-soft); }
.admin-drawer { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
.avatar {
  width:44px; height:44px; border-radius:50%; background:linear-gradient(160deg,var(--accent),#5ac8fa); color:#fff;
  display:inline-flex; align-items:center; justify-content:center; font-size:1.05rem; font-weight:700;
}
/* app shell */
main.shell { padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)); }
.screen { display:none; animation:screenIn .28s cubic-bezier(.2,.8,.2,1); }
.screen.active { display:block; }
@keyframes screenIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
.hero-row { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.hero-row h2 { margin:0; font-size:1.5rem; font-weight:700; letter-spacing:-.02em; }
.hero-row p { margin:2px 0 0; color:var(--ink-soft); font-size:.88rem; }
.action-card {
  display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer;
  background:linear-gradient(135deg, var(--accent), #4aa8ff); color:#fff; border-radius:var(--r-lg);
  padding:22px 24px; margin-bottom:16px; box-shadow:0 12px 28px -10px rgba(0,113,227,.45);
  transition:transform .15s ease;
}
.action-card:active { transform:scale(.98); }
.action-card h3 { margin:0 0 4px; font-size:1.15rem; font-weight:700; }
.action-card p { margin:0; font-size:.85rem; opacity:.9; }
.action-card .arrow { font-size:1.4rem; opacity:.9; }
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.stat-card { padding:18px; }
.stat-card .num { font-size:1.7rem; font-weight:700; letter-spacing:-.02em; }
.stat-card .lbl { font-size:.78rem; color:var(--ink-soft); margin-top:2px; }
/* bottom tab bar */
.tabbar {
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-top:1px solid var(--line);
}
.tabbar button {
  flex:1; background:none; border:none; border-radius:0; padding:6px 4px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-faint);
  font-size:.68rem; font-weight:600;
}
.tabbar button svg { width:23px; height:23px; }
.tabbar button.active { color:var(--accent); }
/* toast */
#toastWrap {
  position:fixed; left:0; right:0; bottom:calc(78px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:center; z-index:30; pointer-events:none;
}
.toast {
  background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:980px; font-size:.86rem; font-weight:600;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.4); opacity:0; transform:translateY(10px); transition:opacity .25s ease, transform .25s ease;
}
.toast.show { opacity:1; transform:none; }
.toast.err { background:var(--warn); color:#fff; }
</style>
</head>
<body>

<header>
  <h1>Marks Entry</h1>
  <div class="who" id="whoBar"></div>
</header>

<main id="mainEl" class="shell">

<div class="center-stage" id="loginStage">
<div class="card" id="loginCard" style="width:100%; max-width:380px;">
  <h2 class="card-title">Sign in</h2>
  <p class="card-sub">Enter the name and PIN your admin gave you.</p>
  <div class="field">
    <label for="loginName">Name</label>
    <input id="loginName" placeholder="Ramesh Sharma" autocomplete="off">
  </div>
  <div class="field">
    <label for="loginPin">4-digit PIN</label>
    <input id="loginPin" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
  </div>
  <button class="primary" id="loginBtn">Sign in</button>
  <div class="status" id="loginStatus"></div>
  <div style="text-align:center; margin-top:16px;">
    <button class="linklike" id="adminToggle">Admin — add a staff login</button>
  </div>
  <div class="hidden admin-drawer" id="adminPanel">
    <div class="field"><label for="adminPass">Admin passcode</label><input id="adminPass" type="password" autocomplete="off"></div>
    <div class="row2">
      <div class="field"><label for="newStaffName">Name</label><input id="newStaffName" autocomplete="off"></div>
      <div class="field"><label for="newStaffPin">PIN</label><input id="newStaffPin" inputmode="numeric" maxlength="4" autocomplete="off"></div>
    </div>
    <button class="ghost" id="addStaffBtn" style="width:100%;">Add staff login</button>
    <div class="status" id="adminStatus"></div>
  </div>
</div>
</div>

<div class="hidden" id="appArea">

  <!-- HOME -->
  <section class="screen active" id="screenHome">
    <div class="hero-row">
      <div class="avatar" id="homeAvatar"></div>
      <div>
        <h2 id="homeGreeting">Hi</h2>
        <p>Ready to enter today's marks?</p>
      </div>
    </div>
    <div class="action-card" id="goMarksCard">
      <div><h3>Enter marks</h3><p>Pick a class, subject and head</p></div>
      <div class="arrow">→</div>
    </div>
    <div class="stat-grid">
      <div class="card stat-card"><div class="num" id="statClasses">21</div><div class="lbl">Classes</div></div>
      <div class="card stat-card"><div class="num" id="statHeads">5</div><div class="lbl">Assessment heads</div></div>
    </div>
  </section>

  <!-- MARKS -->
  <section class="screen" id="screenMarks">
    <div class="card">
      <h2 class="card-title" style="font-size:1.1rem;">Select what to mark</h2>
      <div class="field"><label>Class</label><select id="selClass"></select></div>
      <div class="field"><label>Subject</label><select id="selSubject"></select></div>
      <div class="field">
        <label>Term</label>
        <div class="segmented" id="segTerm"></div>
      </div>
      <div class="field">
        <label>Assessment head</label>
        <div class="segmented" id="segHead"></div>
      </div>
      <button class="primary" id="loadBtn">Load students</button>
    </div>

    <div class="card hidden" id="entryCard">
      <div class="toprow">
        <div>
          <h2 class="card-title" style="font-size:1.1rem;" id="entryTitle"></h2>
          <span class="small" id="lastSaved"></span>
        </div>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Roll</th><th>Student</th><th style="text-align:right">Marks</th></tr></thead>
          <tbody id="stuBody"></tbody>
        </table>
      </div>
      <div style="height:18px"></div>
      <button class="primary" id="saveBtn">Save marks</button>
      <div class="status" id="saveStatus"></div>
    </div>
  </section>

  <!-- MORE -->
  <section class="screen" id="screenMore">
    <div class="card tight">
      <div class="small" style="margin-bottom:12px">Export everything entered so far, for bringing into the school records.</div>
      <button class="ghost" id="exportBtn" style="width:100%;">Export all entries (CSV)</button>
      <div class="status" id="exportStatus"></div>
    </div>
  </section>

</div>

</main>

<div class="hidden tabbar" id="tabbar">
  <button data-screen="screenHome" class="active">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
    Home
  </button>
  <button data-screen="screenMarks">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h11l5 5v13a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1zm7 7H8v2h4v-2zm4 4H8v2h8v-2z"/></svg>
    Marks
  </button>
  <button data-screen="screenMore">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    More
  </button>
</div>

<div id="toastWrap"><div class="toast" id="toastEl"></div></div>

<script>

const WORKER_URL = "https://result.result-300.workers.dev";
let me = null; // {key, name}
let currentDocId = null;
let lockedRows = {}; // marks already saved for the current class/subject/term/head

async function apiPost(path, body){
  const r = await fetch(WORKER_URL + path, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body || {})
  });
  return r.json();
}
async function apiGet(path){
  const r = await fetch(WORKER_URL + path);
  return r.json();
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id));
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("active", b.dataset.screen===id));
  document.getElementById("mainEl").scrollTo(0,0); window.scrollTo(0,0);
}
document.querySelectorAll(".tabbar button").forEach(b=>{
  b.addEventListener("click", ()=>showScreen(b.dataset.screen));
});
document.getElementById("goMarksCard").addEventListener("click", ()=>showScreen("screenMarks"));

function fillSelect(sel, map, placeholder){
  sel.innerHTML = `<option value="">${placeholder}</option>` +
    Object.entries(map).map(([id,name])=>`<option value="${id}">${name}</option>`).join("");
}
fillSelect(document.getElementById("selClass"), CLASSES, "Select class");
fillSelect(document.getElementById("selSubject"), SUBJECTS, "Select subject");

let selectedTerm = null, selectedHead = null;
function buildSegmented(container, map, onPick, labelFn){
  container.innerHTML = "";
  Object.entries(map).forEach(([id, val])=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = labelFn ? labelFn(id, val) : val;
    btn.dataset.id = id;
    btn.addEventListener("click", ()=>{
      [...container.children].forEach(c=>c.classList.remove("active"));
      btn.classList.add("active");
      onPick(id);
    });
    container.appendChild(btn);
  });
}
buildSegmented(document.getElementById("segTerm"), TERMS, id=>{ selectedTerm = id; });
buildSegmented(document.getElementById("segHead"), HEADS, id=>{ selectedHead = id; }, (id,h)=>`${h.name} (${h.max})`);
document.getElementById("statClasses").textContent = Object.keys(CLASSES).length;
document.getElementById("statHeads").textContent = Object.keys(HEADS).length;

function keyFor(name){ return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_"); }

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const nameEl = document.getElementById("loginName");
  const pinEl = document.getElementById("loginPin");
  const status = document.getElementById("loginStatus");
  const name = nameEl.value.trim();
  const pin = pinEl.value.trim();
  if(!name || pin.length !== 4 || !/^\d{4}$/.test(pin)){
    status.textContent = "Enter your name and your 4-digit PIN."; status.className="status err"; return;
  }
  status.textContent = "Checking...";
  try {
    const res = await apiPost("/api/login", {name, pin});
    if(!res.ok){
      status.textContent = res.reason === "not_found"
        ? "Not registered yet — ask the admin to add you."
        : "Wrong PIN.";
      status.className="status err"; return;
    }
    me = {key: res.key, name: res.name};
    document.getElementById("whoBar").textContent = "Signed in as " + me.name;
    document.getElementById("loginStage").classList.add("hidden");
    document.getElementById("appArea").classList.remove("hidden");
    document.getElementById("tabbar").classList.remove("hidden");
    document.getElementById("homeGreeting").textContent = "Hi, " + me.name.split(" ")[0];
    document.getElementById("homeAvatar").textContent = me.name.trim()[0].toUpperCase();
    showScreen("screenHome");
  } catch(err){
    status.textContent = "Could not sign in: " + (err && err.message ? err.message : err);
    status.className = "status err";
  }
});

document.getElementById("adminToggle").addEventListener("click", (e)=>{
  e.preventDefault();
  document.getElementById("adminPanel").classList.toggle("hidden");
});

document.getElementById("addStaffBtn").addEventListener("click", async ()=>{
  const status = document.getElementById("adminStatus");
  const adminPass = document.getElementById("adminPass").value;
  const name = document.getElementById("newStaffName").value.trim();
  const pin = document.getElementById("newStaffPin").value.trim();
  if(!name || pin.length !== 4 || !/^\d{4}$/.test(pin)){
    status.textContent = "Enter a name and a 4-digit PIN."; status.className="status err"; return;
  }
  status.textContent = "Adding...";
  try {
    const res = await apiPost("/api/admin/addStaff", {adminPass, name, pin});
    if(!res.ok){
      status.textContent = res.reason === "bad_passcode" ? "Wrong admin passcode." : "Could not add.";
      status.className="status err"; return;
    }
    status.textContent = `Added ${name}. Share their PIN with them.`; status.className="status ok";
    document.getElementById("newStaffName").value = "";
    document.getElementById("newStaffPin").value = "";
  } catch(err){
    status.textContent = "Could not add: " + (err && err.message ? err.message : err);
    status.className = "status err";
  }
});

document.getElementById("loadBtn").addEventListener("click", async ()=>{
  const classId = document.getElementById("selClass").value;
  const subjId = document.getElementById("selSubject").value;
  const termId = selectedTerm;
  const headId = selectedHead;
  if(!classId || !subjId || !termId || !headId){ alert("Select class, subject, term and head first."); return; }

  const roster = STUDENTS.filter(s=>s.classId===classId).sort((a,b)=>a.roll-b.roll);
  const body = document.getElementById("stuBody");
  body.innerHTML = "";
  const maxMark = HEADS[headId].max;

  currentDocId = `${classId}_${subjId}_${termId}_${headId}`;
  let existing = {};
  lockedRows = {};
  document.getElementById("lastSaved").textContent = "";
  try {
    const res = await apiGet("/api/marks/"+currentDocId);
    const rows = res.rows || {};
    let latestWho = null, latestWhen = 0;
    Object.entries(rows).forEach(([sid,cell])=>{
      existing[sid] = cell.marks;
      if(cell.at && cell.at > latestWhen){ latestWhen = cell.at; latestWho = cell.by; }
    });
    lockedRows = existing;
    if(latestWho) document.getElementById("lastSaved").textContent = `Last saved by ${latestWho} · ${new Date(latestWhen).toLocaleString()}`;
  } catch(e){}

  roster.forEach(s=>{
    const tr = document.createElement("tr");
    const has = existing[s.id] !== undefined;
    const val = has ? existing[s.id] : "";
    const cell = has
      ? `<span class="locked" title="Already saved">${val}${LOCK_ICON}</span>`
      : `<input type="number" min="0" max="${maxMark}" step="0.5" data-sid="${s.id}" value="">`;
    tr.innerHTML = `<td class="roll">${s.roll||""}</td><td>${s.name}</td><td class="marks">${cell}</td>`;
    body.appendChild(tr);
  });

  document.getElementById("entryTitle").textContent =
    `${CLASSES[classId]} · ${SUBJECTS[subjId]} · ${TERMS[termId]} · ${HEADS[headId].name} (${maxMark})`;
  document.getElementById("entryCard").classList.remove("hidden");
});

document.getElementById("saveBtn").addEventListener("click", async ()=>{
  const status = document.getElementById("saveStatus");
  if(!currentDocId || !me){ return; }
  const inputs = document.querySelectorAll("#stuBody input[data-sid]");
  const entries = {};
  inputs.forEach(inp=>{
    if(inp.value !== "") entries[inp.dataset.sid] = Number(inp.value);
  });
  if(Object.keys(entries).length === 0){ status.textContent = "No new marks to save."; status.className="status"; return; }
  status.textContent = "Saving...";
  try {
    const res = await apiPost("/api/marks/"+currentDocId, {entries, by: me.name});
    if(!res.ok){ status.textContent = "Save failed."; status.className="status err"; showToast("Save failed", true); return; }
    status.textContent = "Saved."; status.className = "status ok";
    showToast(`${Object.keys(entries).length} marks saved`);
    document.getElementById("lastSaved").textContent = `Last saved by ${me.name} · ${new Date().toLocaleString()}`;
  } catch(err){
    status.textContent = "Save failed: " + (err && err.message ? err.message : err);
    status.className = "status err";
  }
});

document.getElementById("exportBtn").addEventListener("click", async ()=>{
  const status = document.getElementById("exportStatus");
  const adminPass = prompt("Admin passcode:");
  if(adminPass === null) return;
  status.textContent = "Collecting...";
  try {
    const r = await fetch(WORKER_URL + "/api/export", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({adminPass})
    });
    if(!r.ok){ status.textContent = "Wrong passcode or export failed."; status.className="status err"; return; }
    const csv = await r.text();
    try {
      const downloads = await claude.use("downloads");
      await downloads.save({filename:"marks_export.csv", data:csv});
    } catch(e){
      const blob = new Blob([csv], {type:"text/csv"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "marks_export.csv"; a.click();
    }
    status.textContent = "Export ready."; status.className="status ok";
  } catch(err){
    status.textContent = "Export failed: " + (err && err.message ? err.message : err);
    status.className = "status err";
  }
});
</script>
