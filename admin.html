<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marks Entry — Admin</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--accent:#4f46e5;--accent2:#4338ca;--text:#0f172a;--muted:#64748b;--green:#059669;--red:#dc2626;--amber:#d97706;--border:#e5e9f2;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06)}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 400px at 50% -100px,#e0e7ff,transparent),var(--bg);color:var(--text)}
  header{background:linear-gradient(120deg,#0f172a,#1e1b4b 55%,#3730a3);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 4px 20px rgba(30,27,75,.35)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:52px;height:52px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 3px 10px rgba(0,0,0,.35)}
  header h1{font-size:17px;margin:0}
  header .sub{font-size:12px;color:#c7d2fe;margin-top:2px}
  header button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2);padding:7px 14px;border-radius:999px;font-size:12px;cursor:pointer}
  header button:hover{background:rgba(255,255,255,.25)}
  main{max-width:1100px;margin:0 auto;padding:18px 14px 80px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh)}
  .lock{max-width:360px;margin:64px auto;text-align:center;background:#fff;border:1px solid var(--border);border-radius:20px;padding:30px 26px;box-shadow:var(--sh)}
  .lock .logo{width:96px;height:96px;margin:0 auto 12px;display:block;box-shadow:0 0 0 3px #e0e7ff,0 6px 18px rgba(79,70,229,.25)}
  .lock h2{margin:0 0 16px;font-size:20px}
  .lock input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;outline:none;background:#f8fafc}
  .lock input:focus,select:focus,input.txt:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15);background:#fff}
  .lock button,.btn{padding:10px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,.3);transition:transform .1s}
  .lock button{width:100%}
  .btn:hover,.lock button:hover{transform:translateY(-1px)}
  .btn:disabled{background:#94a3b8;box-shadow:none;cursor:not-allowed;transform:none}
  .btn.ghost{background:#eef2ff;color:var(--accent2);box-shadow:none}
  .btn.danger{background:#fee2e2;color:#991b1b;box-shadow:none}
  .btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .field{flex:1;min-width:150px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
  select,input.txt{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#f8fafc;outline:none}
  .tabs{display:inline-flex;gap:4px;margin-bottom:14px;background:#e8ecf7;padding:4px;border-radius:999px}
  .tab{padding:8px 20px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
  .tab.on{background:#fff;color:var(--accent2);box-shadow:0 2px 8px rgba(15,23,42,.1)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
  th{background:#f8faff;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0}
  tbody tr:hover{background:#fafbff}
  .badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:700;margin:1px 2px 1px 0}
  .b-on{background:#dcfce7;color:#166534}.b-off{background:#fee2e2;color:#991b1b}
  .b-lock{background:#eef2ff;color:#3730a3}.b-open{background:#fef3c7;color:#92400e}
  .muted{color:var(--muted);font-size:12px}
  .status{font-size:13px}.status.ok{color:var(--green)}.status.err{color:var(--red)}
  .hidden{display:none}
  .empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:14px}
  .scroll{overflow:auto;max-height:65vh}
  details.grp{border:1px solid var(--border);border-radius:12px;margin:8px 0;background:#fff}
  details.grp>summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  details.grp[open]>summary{background:#f8faff;border-radius:12px 12px 0 0}
  details.grp .subs{padding:8px 14px 12px;display:flex;flex-wrap:wrap;gap:6px 18px}
  details.grp label.chk{font-size:13.5px;display:flex;gap:6px;align-items:center;cursor:pointer}
  .cnt{font-size:12px;color:var(--muted);font-weight:500}
  .cnt.some{color:var(--green);font-weight:700}
  .bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;min-width:80px}
  .bar>div{height:100%;background:var(--green)}.bar.part>div{background:var(--amber)}
  .warn{color:var(--red);font-weight:700}
  .creds{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
  .creds code{background:#fff;padding:2px 7px;border-radius:6px;border:1px solid #d1fae5;font-size:14px}
</style>
</head>

<script>
const DEFAULT_API = "https://result.result-300.workers.dev";
const API = DEFAULT_API;
let TOKEN = sessionStorage.getItem('eca_admin_token') || "";
let CFG = null, USERS = [], EDIT = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opt = (v, l) => `<option value="${esc(v)}">${esc(l)}</option>`;
const cname = c => ((CFG.classes || {})[c] || {}).name || c;
const sname = s => ((CFG.streams || {})[s] || {}).name || s;
const subname = s => ((CFG.subjects || {})[s] || {}).name || s;

async function api(method, path, body){
  if(!API) throw new Error('Server URL is not set in the page (DEFAULT_API).');
  let r;
  try{
    r = await fetch(API.replace(/\/$/, '') + path, {method, headers: Object.assign({'Content-Type':'application/json'}, TOKEN ? {Authorization:'Bearer ' + TOKEN} : {}), body: body === undefined ? undefined : JSON.stringify(body)});
  }catch(e){ throw new Error('Cannot reach the server. Check your internet connection.'); }
  let data = null; try{ data = await r.json(); }catch(e){}
  if(r.status === 401 && TOKEN){ logout('Session expired. Please log in again.'); throw new Error('Session expired'); }
  if(!r.ok) throw new Error((data && data.error) || ('Server error ' + r.status + '. Open ' + API.replace(/\/$/, '') + '/api/health in a browser to see what is wrong with the Worker setup.'));
  return data;
}

/* ---------- auth ---------- */
async function login(){
  const msg = $('lockMsg'); msg.textContent = '';
  const p = $('passInput').value; if(!p){ msg.textContent = 'Enter the admin passcode'; return; }
  $('loginBtn').disabled = true;
  try{
    TOKEN = '';
    const r = await api('POST', '/api/admin/login', {passcode: p});
    TOKEN = r.token; sessionStorage.setItem('eca_admin_token', TOKEN); $('passInput').value = '';
    await start();
  }catch(e){ msg.textContent = e.message; }
  $('loginBtn').disabled = false;
}
$('passInput').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
function logout(message){
  TOKEN = ''; sessionStorage.removeItem('eca_admin_token'); EDIT = null;
  $('app').classList.add('hidden'); $('lockScreen').classList.remove('hidden');
  $('lockMsg').textContent = typeof message === 'string' ? message : '';
}
function showTab(t){
  $('paneUsers').classList.toggle('hidden', t !== 'users'); $('paneCov').classList.toggle('hidden', t !== 'cov');
  $('tabUsers').classList.toggle('on', t === 'users'); $('tabCov').classList.toggle('on', t === 'cov');
  if(t === 'cov') refreshUsers().catch(() => {});
}
async function start(){
  const b = await api('GET', '/api/bootstrap');
  if(b.role !== 'admin'){ logout('Not an admin session.'); return; }
  CFG = b.config; window.ALLSTUDENTS = b.students;
  $('lockScreen').classList.add('hidden'); $('app').classList.remove('hidden');
  $('schoolName').textContent = ((CFG.school || {}).name || 'School') + ' — Admin';
  const terms = Object.keys(CFG.terms || {}).sort((a, b) => (CFG.terms[a].sqc || CFG.terms[a].id) - (CFG.terms[b].sqc || CFG.terms[b].id)).map(k => opt(k, CFG.terms[k].printName || CFG.terms[k].name)).join('');
  const asses = Object.keys(CFG.assessments || {}).sort((a, b) => (CFG.assessments[a].sqc || CFG.assessments[a].id) - (CFG.assessments[b].sqc || CFG.assessments[b].id)).map(k => opt(k, CFG.assessments[k].name)).join('');
  $('cTerm').innerHTML = terms; $('cAss').innerHTML = asses;
  await refreshUsers();
}

/* ---------- users list ---------- */
function assignStats(a){
  let subs = 0; const classes = Object.keys(a || {});
  classes.forEach(c => Object.keys(a[c]).forEach(st => subs += Object.keys(a[c][st]).length));
  return {subs, classes: classes.length};
}
async function refreshUsers(){
  USERS = (await api('GET', '/api/admin/users')).users;
  const rows = USERS.map(u => {
    const s = assignStats(u.assign);
    return `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td>
      <td><span class="badge ${u.active ? 'b-on' : 'b-off'}">${u.active ? 'Active' : 'Disabled'}</span> <span class="badge ${u.canEdit ? 'b-open' : 'b-lock'}">${u.canEdit ? '✎ Can edit' : '🔒 Locked'}</span> ${u.showFilled || u.canEdit ? '<span class="badge b-lock">Filled visible</span>' : ''}</td>
      <td>${s.subs ? `${s.subs} subject(s) in ${s.classes} class(es)` : '<span class="muted">nothing assigned</span>'}</td>
      <td style="white-space:nowrap"><button class="btn sm ghost" onclick="editUser('${esc(u.uid)}')">Edit</button>
        <button class="btn sm ghost" onclick="toggleActive('${esc(u.uid)}')">${u.active ? 'Disable' : 'Enable'}</button>
        <button class="btn sm danger" onclick="delUser('${esc(u.uid)}')">Delete</button></td></tr>`;
  }).join('');
  $('userRows').innerHTML = rows || '<tr><td colspan="5" class="empty">No users yet. Click "New user".</td></tr>';
}
async function toggleActive(uid){
  const u = USERS.find(x => x.uid === uid); if(!u) return;
  try{ await api('PUT', '/api/admin/users/' + uid, {active: !u.active}); await refreshUsers(); }catch(e){ alert(e.message); }
}

/* ---------- editor ---------- */
function genPassword(){
  const set = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = crypto.getRandomValues(new Uint8Array(8));
  return [...b].map(x => set[x % set.length]).join('');
}
function newUser(){ EDIT = {uid: null, assign: {}}; $('credsBox').innerHTML = ''; renderEditor({name:'', username:'', active:true}, genPassword()); }
function editUser(uid){
  const u = USERS.find(x => x.uid === uid); if(!u) return;
  EDIT = {uid, assign: JSON.parse(JSON.stringify(u.assign || {}))}; $('credsBox').innerHTML = '';
  renderEditor(u, '');
}
function isOn(c, st, sub){ return !!(EDIT.assign[c] && EDIT.assign[c][st] && EDIT.assign[c][st][sub]); }
function setOn(c, st, sub, on){
  if(on){ ((EDIT.assign[c] = EDIT.assign[c] || {})[st] = EDIT.assign[c][st] || {})[sub] = true; }
  else if(EDIT.assign[c] && EDIT.assign[c][st]){
    delete EDIT.assign[c][st][sub];
    if(!Object.keys(EDIT.assign[c][st]).length) delete EDIT.assign[c][st];
    if(!Object.keys(EDIT.assign[c]).length) delete EDIT.assign[c];
  }
}
function groupCount(c, st){ const subs = Object.keys(CFG.classSubjects[c][st]); return {n: subs.filter(s => isOn(c, st, s)).length, total: subs.length}; }

function renderEditor(u, pw){
  const isNew = !EDIT.uid;
  const classes = Object.keys(CFG.classSubjects || {}).filter(c => CFG.classes[c]).sort((a, b) => CFG.classes[a].id - CFG.classes[b].id);
  let groups = '';
  classes.forEach(c => Object.keys(CFG.classSubjects[c]).forEach(st => {
    const sm = CFG.classSubjects[c][st], gc = groupCount(c, st), key = c + '|' + st;
    const subs = Object.keys(sm).sort((a, b) => (sm[a].sqc || 0) - (sm[b].sqc || 0));
    groups += `<details class="grp" ${gc.n ? 'open' : ''}><summary><span>${esc(cname(c))} <span class="muted">· ${esc(sname(st))}</span></span>
      <span><span class="cnt ${gc.n ? 'some' : ''}" id="cnt_${esc(key)}">${gc.n}/${gc.total}</span>
      <button class="btn sm ghost" type="button" onclick="event.preventDefault();grpAll('${esc(c)}','${esc(st)}',true)">All</button>
      <button class="btn sm ghost" type="button" onclick="event.preventDefault();grpAll('${esc(c)}','${esc(st)}',false)">None</button></span></summary>
      <div class="subs">${subs.map(sub => `<label class="chk"><input type="checkbox" data-c="${esc(c)}" data-st="${esc(st)}" data-sub="${esc(sub)}" ${isOn(c, st, sub) ? 'checked' : ''} onchange="onChk(this)"> ${esc(subname(sub))}${sm[sub].optional && !sm[sub].compulsory ? ' <span class="muted">(optional)</span>' : ''}</label>`).join('')}</div></details>`;
  }));
  $('editor').style.display = 'block';
  $('editor').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b>${isNew ? 'New user' : 'Edit user'}</b>
      <button class="btn sm ghost" onclick="closeEditor()">✕ Close</button></div>
    <div class="row">
      <div class="field"><label>Full name</label><input class="txt" id="eName" value="${esc(u.name)}" maxlength="30"></div>
      <div class="field"><label>Username</label><input class="txt" id="eUser" value="${esc(u.username)}" maxlength="20" autocapitalize="none" autocomplete="off"></div>
      <div class="field"><label>${isNew ? 'Password' : 'New password (leave blank to keep)'}</label>
        <div style="display:flex;gap:6px"><input class="txt" id="ePass" value="${esc(pw)}" autocomplete="new-password">
        <button class="btn sm ghost" type="button" onclick="$('ePass').value=genPassword()">Generate</button></div></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-size:14px"><input type="checkbox" id="eActive" ${u.active !== false ? 'checked' : ''}> Account active (can log in)</label>
    <label style="display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px"><input type="checkbox" id="eShow" ${u.showFilled || u.canEdit ? 'checked' : ''}> Show already-filled marks in the student list (off = teacher sees only students still empty)</label>
    <label style="display:flex;gap:8px;align-items:center;margin:6px 0 12px;font-size:14px"><input type="checkbox" id="eEdit" ${u.canEdit ? 'checked' : ''} onchange="if(this.checked)$('eShow').checked=true"> Allow editing marks once entered (off = locked after first save)</label>
    <div style="margin:14px 0 4px"><b>Class &amp; subject assignment</b> <span class="muted">— tick the subjects this user may fill marks for</span></div>
    <div class="scroll" style="max-height:46vh;padding-right:4px">${groups}</div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap">
      <button class="btn" id="saveUserBtn" onclick="saveUser()">${isNew ? 'Create user' : 'Save changes'}</button>
      ${isNew ? '' : '<button class="btn danger" onclick="deleteUser()">Delete user</button>'}
      <span class="status" id="editStatus"></span></div>`;
  $('editor').scrollIntoView({behavior:'smooth', block:'start'});
}
function closeEditor(){ EDIT = null; $('editor').style.display = 'none'; $('editor').innerHTML = ''; }
function refreshCount(c, st){
  const gc = groupCount(c, st), el = $('cnt_' + c + '|' + st);
  if(el){ el.textContent = gc.n + '/' + gc.total; el.className = 'cnt' + (gc.n ? ' some' : ''); }
}
function onChk(el){ setOn(el.dataset.c, el.dataset.st, el.dataset.sub, el.checked); refreshCount(el.dataset.c, el.dataset.st); }
function grpAll(c, st, on){
  Object.keys(CFG.classSubjects[c][st]).forEach(sub => setOn(c, st, sub, on));
  document.querySelectorAll(`input[data-c="${c}"][data-st="${st}"]`).forEach(i => i.checked = on);
  refreshCount(c, st);
}
async function saveUser(){
  const st = $('editStatus'), btn = $('saveUserBtn');
  const name = $('eName').value.trim(), username = $('eUser').value.trim().toLowerCase(), password = $('ePass').value, active = $('eActive').checked, canEdit = $('eEdit').checked, showFilled = $('eShow').checked || $('eEdit').checked;
  st.className = 'status';
  if(!name || !username){ st.textContent = 'Name and username are required.'; st.className = 'status err'; return; }
  btn.disabled = true; st.textContent = 'Saving…';
  try{
    if(!EDIT.uid){
      if(password.length < 6) throw new Error('Password must be at least 6 characters');
      await api('POST', '/api/admin/users', {name, username, password, active, canEdit, showFilled, assign: EDIT.assign});
      $('credsBox').innerHTML = `<div class="creds"><b>User created.</b> Share these login details:<br>Username: <code>${esc(username)}</code> &nbsp; Password: <code>${esc(password)}</code>
        <div class="muted" style="margin-top:4px">The password cannot be viewed again later — you can only set a new one.</div></div>`;
    }else{
      const body = {name, username, active, canEdit, showFilled, assign: EDIT.assign};
      if(password){ if(password.length < 6) throw new Error('Password must be at least 6 characters'); body.password = password; }
      await api('PUT', '/api/admin/users/' + EDIT.uid, body);
      if(password) $('credsBox').innerHTML = `<div class="creds"><b>Saved.</b> New login for ${esc(name)}: username <code>${esc(username)}</code> password <code>${esc(password)}</code> (old sessions were logged out)</div>`;
    }
    closeEditor(); await refreshUsers();
  }catch(e){ st.textContent = '✖ ' + e.message; st.className = 'status err'; btn.disabled = false; }
}
async function delUser(uid){
  const u = USERS.find(x => x.uid === uid);
  if(!u || !confirm(`Delete user "${u.name}" permanently?\n(Marks they already entered are kept.)`)) return;
  try{ await api('DELETE', '/api/admin/users/' + uid); if(EDIT && EDIT.uid === uid) closeEditor(); await refreshUsers(); }catch(e){ alert(e.message); }
}
async function deleteUser(){
  const u = USERS.find(x => x.uid === EDIT.uid);
  if(!u || !confirm(`Delete user "${u.name}" permanently?\n(Marks they already entered are kept.)`)) return;
  try{ await api('DELETE', '/api/admin/users/' + u.uid); closeEditor(); await refreshUsers(); }catch(e){ $('editStatus').textContent = '✖ ' + e.message; $('editStatus').className = 'status err'; }
}

/* ---------- coverage & progress ---------- */
async function loadCoverage(){
  const t = $('cTerm').value, a = $('cAss').value, f = $('cFilter').value, out = $('covOut');
  out.innerHTML = '<div class="card empty">Loading…</div>'; $('covSummary').innerHTML = '';
  let rows;
  try{ await refreshUsers(); rows = (await api('GET', `/api/progress?term=${encodeURIComponent(t)}&ass=${encodeURIComponent(a)}`)).rows; }
  catch(e){ out.innerHTML = '<div class="card empty">Error: ' + esc(e.message) + '</div>'; return; }
  const owners = {};
  USERS.filter(u => u.active).forEach(u => Object.keys(u.assign || {}).forEach(c => Object.keys(u.assign[c]).forEach(st => Object.keys(u.assign[c][st]).forEach(sub => {
    (owners[c + '|' + st + '|' + sub] = owners[c + '|' + st + '|' + sub] || []).push(u.name);
  }))));
  const done = r => r.optional ? r.filled > 0 : r.filled >= r.total;
  rows.forEach(r => { r.owners = owners[r.c + '|' + r.st + '|' + r.sub] || []; });
  const total = rows.length, unassigned = rows.filter(r => !r.owners.length).length, complete = rows.filter(done).length;
  $('covSummary').innerHTML = `<div class="card"><b>${complete}</b> of <b>${total}</b> class-subjects complete · <span class="${unassigned ? 'warn' : ''}"><b>${unassigned}</b> unassigned</span></div>`;
  let shown = rows.filter(r => f === 'all' || (f === 'pending' && !done(r)) || (f === 'unassigned' && !r.owners.length));
  shown.sort((x, y) => (CFG.classes[x.c].id - CFG.classes[y.c].id) || ((CFG.subjects[x.sub] || {}).id || 0) - ((CFG.subjects[y.sub] || {}).id || 0));
  out.innerHTML = `<div class="card" style="padding:0"><div class="scroll"><table><thead><tr><th>Class</th><th>Stream</th><th>Subject</th><th>Filled</th><th></th><th>Assigned to</th><th>Entered by</th></tr></thead><tbody>` +
    (shown.length ? shown.map(r => {
      const pct = !r.optional ? Math.round(r.filled / r.total * 100) : (r.filled ? 100 : 0);
      return `<tr><td>${esc(cname(r.c))}</td><td>${esc(sname(r.st))}</td><td>${esc(subname(r.sub))}</td><td>${r.filled}${!r.optional ? ' / ' + r.total : ' (optional)'}</td>
        <td><div class="bar ${pct < 100 ? 'part' : ''}"><div style="width:${pct}%"></div></div></td>
        <td>${r.owners.length ? esc(r.owners.join(', ')) : '<span class="warn">⚠ Unassigned</span>'}</td><td class="muted">${esc((r.who || []).join(', '))}</td></tr>`;
    }).join('') : '<tr><td colspan="7" class="empty">Nothing to show for this filter.</td></tr>') + '</tbody></table></div></div>';
}

if(TOKEN && API){ start().catch(() => {}); }
</script>
